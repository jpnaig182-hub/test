<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Bahandi - Portal Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-logo">Project Bahandi</div>
    <h2>Portal Gateway</h2>
    <p>Sign in to track your scores, earn coins, and top the global leaderboard!</p>

    <!-- Unified Form Box -->
    <div class="input-group">
      <input type="text" id="username-field" placeholder="Username (For Signup Only)" />
      <input type="email" id="email-field" placeholder="Email Address" required />
      <input type="password" id="password-field" placeholder="Password" required />
    </div>

    <div class="button-group-vertical">
      <button id="btn-login" class="primary">Sign In</button>
      <button id="btn-signup" class="secondary">Create an Account</button>
    </div>

    <p class="back-link"><a href="index.html">← Go back to Map (Explore as Guest)</a></p>
  </div>

  <script type="module">
    import { registerUser, loginUser } from "./auth.js";
    import { auth } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Redirect to home page if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "index.html";
      }
    });

    // Handle Login Click
    document.getElementById("btn-login").addEventListener("click", async () => {
      const e = document.getElementById("email-field").value;
      const p = document.getElementById("password-field").value;
      if (e && p) {
        const user = await loginUser(e, p);
        if (user) window.location.href = "index.html"; // Send them home on success
      } else {
        alert("Please enter your email and password.");
      }
    });

    // Handle Signup Click
    document.getElementById("btn-signup").addEventListener("click", async () => {
      const u = document.getElementById("username-field").value;
      const e = document.getElementById("email-field").value;
      const p = document.getElementById("password-field").value;
      if (u && e && p) {
        const user = await registerUser(e, p, u);
        if (user) window.location.href = "index.html"; // Send them home on success
      } else {
        alert("Please fill in all fields (Username, Email, and Password) to sign up.");
      }
    });
  </script>
</body>
</html>
