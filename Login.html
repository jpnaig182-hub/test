<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Bahandi - Portal Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-logo">Project Bahandi</div>
    <h2>Portal Gateway</h2>
    <p>Sign in with your Google account to track your scores, earn coins, and top the global leaderboard!</p>

    <!-- Google Login Action -->
    <div class="button-group-vertical">
      <button id="btn-google-login" class="primary google-btn" type="button">
        <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18" style="vertical-align: middle; margin-right: 8px;">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.29v3.15C3.26 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.29C.47 8.21 0 10.05 0 12s.47 3.79 1.29 5.42l3.99-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.58l3.99 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <p class="back-link"><a href="index.html">← Go back to Map (Explore as Guest)</a></p>
  </div>

  <script type="module">
    import { loginWithGoogle } from "./auth.js";
    import { auth } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Redirect to home page if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "index.html";
      }
    });

    // Handle Google Login Button Click
    document.getElementById("btn-google-login").addEventListener("click", async () => {
      const user = await loginWithGoogle();
      if (user) {
        window.location.href = "index.html"; // Send them home on success
      }
    });
  </script>
</body>
</html>
